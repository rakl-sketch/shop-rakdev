name: Apply Supabase Migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: Migration file path
        required: true
        default: supabase/migrations/202611270001_qris_checkout.sql
        type: string

permissions:
  contents: read

concurrency:
  group: apply-supabase-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MIGRATION: ${{ inputs.migration }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration path
        run: |
          case "$MIGRATION" in
            supabase/migrations/*.sql) ;;
            *) echo "Migration harus berada di supabase/migrations/*.sql"; exit 1 ;;
          esac
          if [[ "$MIGRATION" == *".."* ]]; then
            echo "Path traversal tidak diizinkan."
            exit 1
          fi
          test -f "$MIGRATION"
      - name: Apply SQL through Supabase Management API
        run: |
          jq -n --rawfile query "$MIGRATION" '{query: $query}' > payload.json
          curl --fail --silent --show-error \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @payload.json
